<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración - MMX Quota</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="config-body">
  <div class="config-window">
    <div class="config-header" style="-webkit-app-region: drag">
      <h3>Configuración</h3>
      <button class="btn-config-close" id="btnConfigClose" style="-webkit-app-region: no-drag">✕</button>
    </div>

    <div class="config-content">
      <label>API Token (Bearer):</label>
      <input type="password" id="configToken" placeholder="Ingresa tu API Token">

      <label>Base URL:</label>
      <input type="text" id="configBaseUrl" placeholder="https://api.minimax.io">

      <label>Token Plan Key (opcional):</label>
      <input type="text" id="configPlanKey" placeholder="Token Plan Key">

      <label>Intervalo de actualización (segundos):</label>
      <input type="number" id="configInterval" placeholder="30" min="10" max="300">

      <label>Transparencia ventana: <span id="opacityValue">95</span>%</label>
      <input type="range" id="configOpacity" min="50" max="100" value="95">

      <label>Transparencia modelos: <span id="modelOpacityValue">100</span>%</label>
      <input type="range" id="configModelOpacity" min="20" max="100" value="100">

      <div class="model-filter-section">
        <label>Modelos a mostrar:</label>
        <div id="modelFilterList" class="model-filter-list"></div>
      </div>
    </div>

    <div class="config-footer">
      <button id="btnSaveConfig" class="btn-save">Guardar</button>
      <button id="btnCancelConfig" class="btn-cancel">Cancelar</button>
    </div>
  </div>

  <script src="config.js"></script>
</body>
</html>
